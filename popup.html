<!DOCTYPE html>
<html>
<head>
  <title>Google Docs Background</title>

  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #ffffff;
    }

    h1 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input[type="text"],
    select {
      width: 100%;
      margin-bottom: 16px;
      padding: 8px;
      box-sizing: border-box;
    }

    input[type="range"] {
      width: 100%;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      background: #1a73e8;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #1558b0;
    }
  </style>
</head>
<body>
  <h1>Google Docs Background</h1>

  <label>Background Image URL</label>
  <input id="imageUrl" type="text" placeholder="https://example.com/image.jpg" />

  <label>Opacity</label>
  <input id="opacity" type="range" min="0" max="1" step="0.01" />

  <label>Background Size Mode</label>
  <select id="backgroundMode">
    <option value="cover">Cover Screen</option>
    <option value="100%">100% Width</option>
  </select>

  <button id="saveBtn">Save</button>

  <script src="popup.js"></script>
</body>
</html>
